# Window numbering starts at 1.
set -g base-index 1

# Keep application title escape sequences from replacing the directory name.
set-option -g allow-rename off

# Name windows and terminal tabs after the active directory.
set-window-option -g automatic-rename on
set-window-option -g automatic-rename-format '#{b:pane_current_path}'
set-option -g set-titles on
set-option -g set-titles-string 'tmux: #W'

# Switch windows without the tmux prefix.
bind-key -n S-Left previous-window
bind-key -n S-Right next-window

# Keep more scrollback history available.
set -g history-limit 10000

# Enable mouse scrolling and selection.
set -g mouse on
setw -g monitor-activity on

# Copy selections to the system clipboard on WSL or native Linux.
if-shell 'command -v clip.exe >/dev/null 2>&1' \
	'bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip.exe"; bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip.exe"' \
	'bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"; bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"'

# Avoid a delay when tmux receives the escape key.
set -sg escape-time 0

# Pane borders.
set -g pane-border-style fg=black
set -g pane-active-border-style fg=brightred

# Status bar alignment, colors, and refresh rate.
set -g status-justify left
set -g status-style fg=colour12,bg=default
set -g status-interval 2

# Message colors.
set -g message-style fg=black,bg=yellow
set -g message-command-style fg=blue,bg=black

# Copy-mode and clock colors.
setw -g mode-style bg=colour6,fg=colour0
setw -g clock-mode-colour colour135
setw -g mode-style fg=colour196,bg=colour238,bold

# Window status formats and colors.
setw -g window-status-format " #F#I:#W#F "
setw -g window-status-current-format " #F#I:#W#F "
setw -g window-status-format "#[fg=magenta]#[bg=black] #I #[bg=cyan]#[fg=colour8] #W "
setw -g window-status-current-format "#[bg=brightmagenta]#[fg=colour8] #I #[fg=colour8]#[bg=colour14] #W "
setw -g window-status-current-style fg=colour11,bg=colour0,dim
setw -g window-status-style fg=black,bg=green,reverse

# No session name is shown on the left side of the status bar.
set -g status-left ''

# Disable activity and bell notifications.
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

set -g default-terminal "screen-256color"

# Detailed pane border colors.
set -g pane-border-style bg=colour235,fg=colour238
set -g pane-active-border-style bg=colour236,fg=colour51

# Status bar position, colors, and content.
set -g status-position bottom
set -g status-style fg=colour137,bg=colour234,dim
set -g status-left ''
set -g status-right '#[fg=colour233,bg=colour241,bold] %m/%d/%Y #[fg=colour233,bg=colour245,bold] %l:%M %p '
set -g status-right-length 50
set -g status-left-length 20

setw -g window-status-current-style fg=colour81,bg=colour238,bold
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '

setw -g window-status-style fg=colour138,bg=colour235
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

setw -g window-status-bell-style bold,fg=colour255,bg=colour1

# Message colors for the active theme.
set -g message-style bold,fg=colour232,bg=colour166
